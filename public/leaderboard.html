<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MemeVerse — Live Leaderboard 🏆</title>
  <meta name="description" content="MemeVerse live quiz leaderboard — see who's dominating!" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .lb-page {
      max-width: 640px; margin: 0 auto; padding: 24px 16px 60px;
    }
    .lb-header {
      text-align: center; margin-bottom: 32px; padding-top: 20px;
    }
    .lb-subtitle {
      font-size: 0.9rem; font-weight: 700;
      color: rgba(255,255,255,0.4);
      letter-spacing: 3px; text-transform: uppercase;
      margin-top: 10px;
    }
    .lb-list { display: flex; flex-direction: column; gap: 10px; }
    .lb-empty {
      text-align: center; padding: 60px 20px;
      color: rgba(255,255,255,0.3);
      font-size: 1.1rem; font-weight: 700;
    }
    .lb-empty span { font-size: 3rem; display: block; margin-bottom: 16px; }

    /* Podium */
    .podium {
      display: flex; align-items: flex-end; justify-content: center;
      gap: 12px; margin-bottom: 36px;
    }
    .podium-slot {
      display: flex; flex-direction: column; align-items: center;
      gap: 8px; flex: 1; max-width: 140px;
    }
    .podium-avatar {
      width: 64px; height: 64px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      border: 3px solid transparent;
    }
    .podium-slot:nth-child(1) .podium-avatar { border-color: #C0C0C0; background: rgba(192,192,192,0.1); }
    .podium-slot:nth-child(2) .podium-avatar { border-color: var(--yellow); background: rgba(255,230,0,0.15); width: 80px; height: 80px; font-size: 2.5rem; }
    .podium-slot:nth-child(3) .podium-avatar { border-color: #CD7F32; background: rgba(205,127,50,0.1); }
    .podium-name { font-weight: 900; font-size: 0.9rem; text-align: center; }
    .podium-score { font-size: 0.8rem; font-weight: 700; color: var(--yellow); }
    .podium-block {
      width: 100%; border-radius: 12px 12px 0 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; font-weight: 900;
    }
    .podium-slot:nth-child(1) .podium-block { height: 70px; background: rgba(192,192,192,0.1); border: 1px solid rgba(192,192,192,0.2); }
    .podium-slot:nth-child(2) .podium-block { height: 100px; background: rgba(255,230,0,0.12); border: 1px solid rgba(255,230,0,0.3); }
    .podium-slot:nth-child(3) .podium-block { height: 50px; background: rgba(205,127,50,0.1); border: 1px solid rgba(205,127,50,0.2); }

    .lb-section-title {
      font-size: 0.8rem; font-weight: 800;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase; letter-spacing: 3px;
      margin-bottom: 14px; padding-left: 4px;
    }

    /* Stats bar */
    .stats-bar {
      display: flex; gap: 12px; margin-bottom: 28px;
    }
    .stat-card {
      flex: 1; text-align: center;
      padding: 16px 10px;
      border-radius: 16px;
    }
    .stat-val { font-size: 1.6rem; font-weight: 900; color: var(--yellow); }
    .stat-label { font-size: 0.75rem; font-weight: 700; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; }

    /* Live indicator */
    .live-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px;
      background: rgba(255,68,68,0.1);
      border: 1px solid rgba(255,68,68,0.3);
      border-radius: 50px;
      font-size: 0.8rem; font-weight: 800;
      color: #FF4444;
      text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 20px;
    }
    .live-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #FF4444;
      animation: pulse-dot 1s infinite;
    }
  </style>
</head>
<body>
  <div class="animated-bg"></div>
  <div id="particles"></div>

  <div class="lb-page">
    <!-- Header -->
    <div class="lb-header">
      <div class="logo" style="display:inline-flex; flex-direction:column; align-items:center;">
        <span class="logo-meme">MEME</span>
        <span class="logo-verse">VERSE</span>
      </div>
      <div class="lb-subtitle">🏆 Live Leaderboard</div>
      <div style="height:12px;"></div>
      <div class="live-badge"><span class="live-dot"></span> LIVE</div>

      <!-- Stats -->
      <div class="stats-bar" id="statsBar">
        <div class="glass-card stat-card">
          <div class="stat-val" id="statPlayers">0</div>
          <div class="stat-label">Players</div>
        </div>
        <div class="glass-card stat-card">
          <div class="stat-val" id="statTop">—</div>
          <div class="stat-label">Top Score</div>
        </div>
        <div class="glass-card stat-card">
          <div class="stat-val" id="statAvg">—</div>
          <div class="stat-label">Avg Score</div>
        </div>
      </div>
    </div>

    <!-- Podium (Top 3) -->
    <div class="podium" id="podium" style="display:none">
      <div class="podium-slot" id="pod2">
        <div class="podium-avatar">😐</div>
        <div class="podium-name">—</div>
        <div class="podium-score">0</div>
        <div class="podium-block">🥈</div>
      </div>
      <div class="podium-slot" id="pod1">
        <div class="podium-avatar">😐</div>
        <div class="podium-name">—</div>
        <div class="podium-score">0</div>
        <div class="podium-block">🥇</div>
      </div>
      <div class="podium-slot" id="pod3">
        <div class="podium-avatar">😐</div>
        <div class="podium-name">—</div>
        <div class="podium-score">0</div>
        <div class="podium-block">🥉</div>
      </div>
    </div>

    <!-- Full list -->
    <div class="lb-section-title" id="restTitle" style="display:none">All Players</div>
    <div class="lb-list" id="lbList">
      <div class="lb-empty">
        <span>⏳</span>
        Waiting for participants to join...
      </div>
    </div>

    <div style="text-align:center; margin-top:28px;">
      <a href="/" class="btn btn-outline">← Back to Join</a>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let maxScore = 1;

    // Particles
    const EMOJIS = ['😂','🔥','💀','😎','🤡','🥶','👀','💯','🤣','😤','🤯','🫡'];
    const particlesEl = document.getElementById('particles');
    for (let i = 0; i < 12; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = (10 + Math.random() * 12) + 's';
      p.style.animationDelay = (Math.random() * 8) + 's';
      particlesEl.appendChild(p);
    }

    socket.on('leaderboard', (lb) => {
      renderLeaderboard(lb);
    });

    socket.on('participants:count', (count) => {
      // handled via leaderboard update
    });

    function renderLeaderboard(lb) {
      const medals = ['🥇','🥈','🥉'];
      const list = document.getElementById('lbList');
      const podium = document.getElementById('podium');

      if (!lb || lb.length === 0) {
        list.innerHTML = `<div class="lb-empty"><span>⏳</span>Waiting for participants to join...</div>`;
        podium.style.display = 'none';
        document.getElementById('restTitle').style.display = 'none';
        return;
      }

      maxScore = Math.max(1, lb[0]?.score || 1);

      // Stats
      document.getElementById('statPlayers').textContent = lb.length;
      document.getElementById('statTop').textContent = (lb[0]?.score || 0).toLocaleString();
      const avg = lb.length > 0 ? Math.round(lb.reduce((a, p) => a + p.score, 0) / lb.length) : 0;
      document.getElementById('statAvg').textContent = avg.toLocaleString();

      // Podium
      if (lb.length >= 2) {
        podium.style.display = 'flex';
        renderPod('pod1', lb[0]);
        renderPod('pod2', lb[1] || null);
        renderPod('pod3', lb[2] || null);
      } else if (lb.length === 1) {
        podium.style.display = 'flex';
        renderPod('pod1', lb[0]);
        renderPod('pod2', null);
        renderPod('pod3', null);
      }

      // Rest of list (4+)
      const rest = lb.slice(3);
      if (rest.length > 0) {
        document.getElementById('restTitle').style.display = 'block';
        list.innerHTML = '';
        rest.forEach((p, i) => {
          const row = document.createElement('div');
          row.className = 'lb-row';
          const barW = maxScore > 0 ? ((p.score / maxScore) * 100) : 0;
          row.innerHTML = `
            <span class="lb-rank">#${i + 4}</span>
            <span class="lb-emoji">${p.emoji}</span>
            <span class="lb-name">${escapeHtml(p.name)}</span>
            <span class="lb-score">${p.score.toLocaleString()}</span>
            <div class="lb-score-bar" style="width:${barW}%"></div>
          `;
          list.appendChild(row);
        });
      } else {
        list.innerHTML = '';
        document.getElementById('restTitle').style.display = 'none';
      }
    }

    function renderPod(id, player) {
      const slot = document.getElementById(id);
      if (!player) {
        slot.querySelector('.podium-avatar').textContent = '—';
        slot.querySelector('.podium-name').textContent = '—';
        slot.querySelector('.podium-score').textContent = '0';
        return;
      }
      slot.querySelector('.podium-avatar').textContent = player.emoji;
      slot.querySelector('.podium-name').textContent = player.name;
      slot.querySelector('.podium-score').textContent = player.score.toLocaleString() + ' pts';
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // Join as spectator — does NOT count as a participant
    socket.on('connect', () => {
      socket.emit('spectate');
    });
  </script>
</body>
</html>
